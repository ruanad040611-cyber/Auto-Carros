<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Carros ADM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='imagens/favicon.png')}}" type="image/x-icon">
</head>
<body class="body_adm">
    <header>
        <img src="{{ url_for('static', filename='imagens/carro.png') }}" alt="">
        <h1>Administração</h1>
        <h3>Bem-Vindo a área de Administração</h3>
    </header>
    <main>
        <div>
            <h4>Guia</h4>
            <p>
                Aqui é onde você vai postar posts sobre a Auto Carros,
                seja criativo e confiante para que atraia clientes para 
                nossa loja.
            </p>
        </div>
        <form method="POST" enctype="multipart/form-data">
            <h3>Adicionar Posts</h3>
            <h4>Título</h4>
            <input type="text" name="titulo">
            <h4>Imagem</h4>
            <input type="file" name="imagem" class="file">
            <h4>Vídeo</h4>
            <input type="file" name="video" class="file">
            <h4>Texto</h4>
            <input type="text" name="texto">
            <button type="submit">Enviar</button>
        </form>
    </main>
</body>
</html>
