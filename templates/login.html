<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Carros Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='imagens/favicon.png')}}" type="image/x-icon">
</head>
<body class="body_login_cadastro">
    <div>
        <h3>O Blog contêm vídeos, 
            fotos e escritas sobre a empressa
        </h3>
        <p>Todo dia tem um novo post sendo
             ele vídeo, foto e até escritas
        </p>
    </div>
    <form method="POST" class="form_login_cadastro">
        <h3>Email:</h3>
        <input type="email" name="email">
        <h3>Senha</h3>
        <input type="password" name="senha">
        <h4>Não tem conta?</h4>
        <a href="cadastro.html">Cadastro</a>
        <button type="submit">enviar</button>
        {% if p %}
            <p>{{p}}</p>
        {% endif %}
    </form>
</body>
</html>
